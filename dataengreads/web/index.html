<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataEngReads</title>
<meta name="description" content="Real-world data engineering case studies from company engineering blogs, tagged by problem, stack and scale.">

<style>
:root {
  --bg: #fbfaf7; --card: #ffffff; --text: #1c1b19; --muted: #6b6860; --line: #e4e1d9;
  --accent: #2856c7; --accent-soft: #e8eefc; --chip: #f1efe9; --warn: #a15c00; --on-accent: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131416; --card: #1b1d20; --text: #ecebe8; --muted: #9b9a95; --line: #2c2f33;
    --accent: #8fb0ff; --accent-soft: #1f2a44; --chip: #26292d; --warn: #e0a35a; --on-accent: #0f1626;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }
header { padding: 28px 0 8px; }
h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
h1 a { color: inherit; text-decoration: none; }
h1 .brand { color: var(--accent); }
.tagline { margin: 4px 0 0; color: var(--muted); }
nav.modes { display: flex; gap: 8px; margin: 16px 0 0; }
nav.modes a { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--accent); text-decoration: none;
  background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 500; }
nav.modes a[aria-current="page"] { background: var(--accent); color: var(--on-accent); }
.controls { display: grid; grid-template-columns: 2fr repeat(5, 1fr); gap: 8px; margin: 16px 0 8px; }
.controls input, .controls select { width: 100%; padding: 8px 10px; font: inherit; font-size: 14px;
  background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 14px;
  margin: 8px 0 16px; }
.status button { font: inherit; font-size: 13px; padding: 2px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--text); }
.pagehead { margin: 8px 0 4px; }
.pagehead h2 { margin: 0; font-size: 22px; }
.pagehead p { margin: 4px 0 0; color: var(--muted); }
.questions { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin: 12px 0 20px; }
.questions button { text-align: left; font: inherit; font-size: 15px; padding: 12px 14px; cursor: pointer;
  background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 10px; }
.questions button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.questions small { display: block; color: var(--muted); margin-top: 2px; }
ol.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); }
.meta .type { text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; font-weight: 600; }
.card h3 { margin: 6px 0 8px; font-size: 18px; line-height: 1.35; overflow-wrap: anywhere; }
.card h3 a { color: var(--text); text-decoration: none; }
.card h3 a:hover { text-decoration: underline; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.tag, .chip { font: inherit; font-size: 12px; padding: 2px 9px; border-radius: 999px; cursor: pointer;
  border: 1px solid transparent; }
.tag { background: var(--accent-soft); color: var(--accent); }
.chip { background: var(--chip); color: var(--text); border-color: var(--line); }
.scale { margin: 0 0 6px; font-size: 14px; color: var(--warn); font-variant-numeric: tabular-nums; }
.summary { margin: 0 0 10px; }
details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
details ul { margin: 8px 0; padding-left: 20px; }
details .angle { margin: 8px 0 0; padding: 8px 12px; background: var(--chip); border-radius: 8px; font-size: 15px; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 14px; }
.hn { color: var(--muted); }
.more { display: block; margin: 16px auto; font: inherit; padding: 8px 20px; cursor: pointer; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); }
.empty { padding: 32px 0; text-align: center; color: var(--muted); }
footer { margin: 32px 0; color: var(--muted); font-size: 13px; }
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 720px) {
  .controls { grid-template-columns: 1fr 1fr; }
  .controls input { grid-column: 1 / -1; }
  h1 { font-size: 24px; }
  .card { padding: 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="#">DataEng<span class="brand">Reads</span></a></h1>
    <p class="tagline">Real-world data engineering case studies from company engineering blogs.</p>
    <nav class="modes" aria-label="Mode">
      <a href="#" id="mode-browse">Browse</a>
      <a href="#mode=interview" id="mode-interview">Interview mode</a>
    </nav>
  </header>
  <main>
    <div id="pagehead" class="pagehead"></div>
    <div id="questions" class="questions" hidden></div>
    <div class="controls" id="controls">
      <input id="q" type="search" placeholder="Search titles, summaries, stack…" aria-label="Search">
      <select id="problem" aria-label="Problem"></select>
      <select id="company" aria-label="Company"></select>
      <select id="industry" aria-label="Industry"></select>
      <select id="type" aria-label="Post type"></select>
      <select id="sort" aria-label="Sort">
        <option value="best">Best</option><option value="new">Newest</option><option value="hn">Most discussed</option>
      </select>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <ol class="cards" id="cards"></ol>
    <button class="more" id="more" hidden>Show more</button>
  </main>
  <footer id="footer"></footer>
</div>
<script src="data.js"></script>
<script>
"use strict";
// Every scraped string is set with textContent / attributes, never innerHTML.
const D = window.DATA || { posts: [], problems: {}, post_types: [], questions: [] };
const PAGE = 40;
const $ = (id) => document.getElementById(id);
const TYPE_LABEL = { case_study: "Case study", postmortem: "Postmortem", deep_dive: "Deep dive",
  open_source: "Open source", opinion: "Opinion", announcement: "Announcement" };

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "text") n.textContent = v;
    else if (k === "on") for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
    else n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid != null) n.append(kid);
  return n;
}
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : "#");
const problemsOf = (p) => [p.primary_problem, ...(p.problems || [])].filter(Boolean);

// State lives in the URL hash so filters and stack pages are linkable, even from file://.
function readState() {
  const h = new URLSearchParams(location.hash.slice(1));
  return { mode: h.get("mode") || "", q: h.get("q") || "", problem: h.get("problem") || "",
    company: h.get("company") || "", industry: h.get("industry") || "", type: h.get("type") || "",
    stack: h.get("stack") || "", sort: h.get("sort") || "best", iq: h.get("iq") || "" };
}
let state = readState(), shown = PAGE;
function setState(patch, push = true) {
  state = { ...state, ...patch };
  const h = new URLSearchParams();
  for (const [k, v] of Object.entries(state)) if (v && !(k === "sort" && v === "best")) h.set(k, v);
  const hash = h.toString() ? "#" + h.toString() : location.pathname + location.search;
  push ? history.pushState(null, "", hash) : history.replaceState(null, "", hash);
  shown = PAGE;
  render();
}

function options(select, label, entries) {
  select.replaceChildren(el("option", { value: "", text: label }),
    ...entries.map(([v, t]) => el("option", { value: v, text: t })));
}
function counts(key) {
  const c = new Map();
  for (const p of D.posts) for (const v of [].concat(key(p))) if (v) c.set(v, (c.get(v) || 0) + 1);
  return [...c].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(b[0]));
}
function initControls() {
  options($("problem"), "All problems", counts(problemsOf).map(([id, n]) => [id, `${D.problems[id] || id} (${n})`]));
  options($("company"), "All companies", counts((p) => p.company).map(([c, n]) => [c, `${c} (${n})`]));
  options($("industry"), "All industries", counts((p) => p.industry).map(([c, n]) => [c, `${c} (${n})`]));
  options($("type"), "All types", D.post_types.filter((t) => D.posts.some((p) => p.post_type === t))
    .map((t) => [t, TYPE_LABEL[t] || t]));
  for (const id of ["problem", "company", "industry", "type", "sort"])
    $(id).addEventListener("change", (e) => setState({ [id]: e.target.value }));
  let timer;
  $("q").addEventListener("input", (e) => { clearTimeout(timer); timer = setTimeout(() => setState({ q: e.target.value.trim() }, false), 200); });
  $("more").addEventListener("click", () => { shown += PAGE; renderCards(); });
  window.addEventListener("popstate", () => { state = readState(); shown = PAGE; render(); });
  $("footer").textContent = `${D.posts.length} posts · built ${D.built_at || ""} · Summaries and tags are ours, written by an LLM; ` +
    "every card links to the original post on the company's blog.";
}

function matches(p) {
  const s = state;
  if (s.problem && !problemsOf(p).includes(s.problem)) return false;
  if (s.company && p.company !== s.company) return false;
  if (s.industry && p.industry !== s.industry) return false;
  if (s.type && p.post_type !== s.type) return false;
  if (s.stack && !(p.stack || []).some((t) => t.toLowerCase() === s.stack.toLowerCase())) return false;
  if (s.mode === "interview" && s.iq !== "") {
    const q = D.questions[+s.iq];
    if (q && !problemsOf(p).some((id) => q.problems.includes(id))) return false;
    if (q && q.stack && !(p.stack || []).some((t) => q.stack.includes(t))) return false;
  }
  if (s.q) {
    const hay = [p.title, p.summary, p.company, p.scale, ...(p.stack || [])].join(" ").toLowerCase();
    if (!s.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w))) return false;
  }
  return true;
}
const SORTS = {
  best: (a, b) => b.score - a.score,
  new: (a, b) => (b.date || "").localeCompare(a.date || ""),
  hn: (a, b) => b.hn_comments - a.hn_comments || b.hn_points - a.hn_points || b.score - a.score,
};
let results = [];

function card(p) {
  const tags = el("div", { class: "tags" },
    ...problemsOf(p).map((id) => el("button", { class: "tag", type: "button", title: "Filter by this problem",
      text: D.problems[id] || id, on: { click: () => setState({ problem: id, mode: "" }) } })),
    ...(p.stack || []).map((t) => el("button", { class: "chip", type: "button", title: `${t} in production`,
      text: t, on: { click: () => setState({ stack: t, mode: "" }) } })));
  const decisions = (p.key_decisions || []).length || p.interview_angle
    ? el("details", {}, el("summary", { text: "Key decisions & interview angle" }),
        el("ul", {}, ...(p.key_decisions || []).map((d) => el("li", { text: d }))),
        p.interview_angle ? el("p", { class: "angle", text: "Interview: " + p.interview_angle }) : null)
    : null;
  const hn = p.hn_points > 0 ? el("span", { class: "hn", text: `▲ ${p.hn_points} on Hacker News · ${p.hn_comments} comments` }) : el("span");
  return el("li", { class: "card" },
    el("div", { class: "meta" }, el("span", { class: "type", text: TYPE_LABEL[p.post_type] || p.post_type || "" }),
      el("span", { text: p.company }), p.date ? el("time", { datetime: p.date, text: p.date }) : null),
    el("h3", {}, el("a", { href: safeUrl(p.url), target: "_blank", rel: "noopener", text: p.title })),
    tags,
    p.scale ? el("p", { class: "scale", text: "Scale: " + p.scale }) : null,
    el("p", { class: "summary", text: p.summary || "" }),
    decisions,
    el("div", { class: "foot" }, hn,
      el("a", { href: safeUrl(p.url), target: "_blank", rel: "noopener", text: `Read on ${p.company} blog ↗` })));
}

function renderHead() {
  const head = $("pagehead"), qs = $("questions"), interview = state.mode === "interview";
  $("mode-browse").removeAttribute("aria-current");
  $("mode-interview").removeAttribute("aria-current");
  $(interview ? "mode-interview" : "mode-browse").setAttribute("aria-current", "page");
  qs.hidden = !interview;
  if (interview) {
    head.replaceChildren(el("h2", { text: "Interview mode" }),
      el("p", { text: "Pick a system-design question to see how real companies answered it." }));
    qs.replaceChildren(...D.questions.map((q, i) => {
      const n = D.posts.filter((p) => problemsOf(p).some((id) => q.problems.includes(id))).length;
      return el("button", { type: "button", "aria-pressed": String(state.iq === String(i)),
        on: { click: () => setState({ iq: state.iq === String(i) ? "" : String(i) }) } },
        q.q, el("small", { text: `${n} post${n === 1 ? "" : "s"}` }));
    }));
  } else if (state.stack) {
    const others = counts((p) => (p.stack || []).some((t) => t.toLowerCase() === state.stack.toLowerCase()) ? p.stack : [])
      .filter(([t]) => t.toLowerCase() !== state.stack.toLowerCase()).slice(0, 6).map(([t]) => t);
    head.replaceChildren(el("h2", { text: `${state.stack} in production` }),
      el("p", { text: others.length ? `Often used with ${others.join(", ")}.` : "" }));
  } else head.replaceChildren();
}

function renderStatus() {
  const s = state, active = [];
  const chip = (text, key) => el("button", { type: "button", title: "Remove filter", text: text + " ✕",
    on: { click: () => setState({ [key]: "" }) } });
  if (s.stack) active.push(chip("Stack: " + s.stack, "stack"));
  if (s.q) active.push(chip(`“${s.q}”`, "q"));
  const any = s.q || s.problem || s.company || s.industry || s.type || s.stack || s.iq;
  if (any) active.push(el("button", { type: "button", text: "Clear all", on: { click: () =>
    setState({ q: "", problem: "", company: "", industry: "", type: "", stack: "", iq: "" }) } }));
  $("status").replaceChildren(el("span", { text: `${results.length} of ${D.posts.length} posts` }), ...active);
}

function renderCards() {
  const list = $("cards");
  list.replaceChildren(...results.slice(0, shown).map(card));
  if (!results.length) list.replaceChildren(el("li", { class: "empty", text: "No posts match these filters." }));
  $("more").hidden = results.length <= shown;
  $("more").textContent = `Show more (${results.length - shown} left)`;
}

function render() {
  for (const id of ["problem", "company", "industry", "type", "sort"]) $(id).value = state[id];
  if (document.activeElement !== $("q")) $("q").value = state.q;
  results = D.posts.filter(matches).sort(SORTS[state.sort] || SORTS.best);
  renderHead();
  renderStatus();
  renderCards();
}

initControls();
render();
</script>
</body>
</html>
